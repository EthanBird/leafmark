[package]
name = "leafmark"
version = "0.4.2"
description = "A fast, local-first Markdown workspace"
authors = ["LeafMark contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "leafmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomicwrites = "0.4"
fontdb = { version = "0.24", default-features = false, features = ["fs"] }
ignore = "0.4"
parking_lot = "0.12"
percent-encoding = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[package]
name = "leafmark-native-compat"
version = "0.7.4-native.1"
description = "LeafMark native Windows compatibility edition without WebView2"
authors = ["LeafMark contributors"]
edition = "2021"
rust-version = "1.89"
build = "build.rs"

[features]
# Used only for local type-checking on Linux. Windows release builds keep this
# disabled and therefore do not carry any X11/Wayland backend.
linux-check = ["iced/x11"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
  "advanced-shaping",
  "crisp",
  "markdown",
  "tiny-skia",
  "tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

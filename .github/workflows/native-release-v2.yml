name: Publish LeafMark Native alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-release-v2.yml
      - native/**

permissions:
  contents: write
  statuses: write

concurrency:
  group: leafmark-native-alpha-publish
  cancel-in-progress: false

jobs:
  resolve:
    if: startsWith(github.event.head_commit.message, 'Publish LeafMark Native v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version=$(python - <<'PY'
          import tomllib
          with open('native/Cargo.toml', 'rb') as handle:
              print(tomllib.load(handle)['workspace']['package']['version'])
          PY
          )
          expected="Publish LeafMark Native v$version"
          actual=$(printf '%s' "${{ github.event.head_commit.message }}" | head -n 1)
          test "$actual" = "$expected" || {
            echo "Expected release commit: $expected" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Mark release pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg state pending \
            --arg description "Building Windows and Linux Native alpha assets" \
            --arg context "leafmark/native-alpha-release" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,description:$description,context:$context,target_url:$target_url}' \
            > "$RUNNER_TEMP/status.json"
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate shared dependency lock
        working-directory: native
        run: cargo generate-lockfile

      - uses: actions/upload-artifact@v4
        with:
          name: leafmark-native-lock
          path: native/Cargo.lock
          if-no-files-found: error
          retention-days: 7

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: leafmark-native-package-linux
          - os: windows-latest
            platform: windows
            artifact: leafmark-native-package-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: leafmark-native-lock
          path: native

      - name: Install Linux renderer dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: native-alpha-${{ matrix.platform }}

      - name: Test core libraries
        working-directory: native
        run: cargo test --locked -p leafmark-domain -p leafmark-core -p leafmark-markdown -p leafmark-workspace

      - name: Build optimized Native binary
        working-directory: native
        run: cargo build --locked --release -p leafmark-native

      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          root="$RUNNER_TEMP/leafmark-native-assets"
          stage="$root/LeafMark-Native-v$VERSION-Linux-x86_64"
          mkdir -p "$stage"
          install -m 755 native/target/release/leafmark-native "$stage/LeafMark-Native"
          cp native/README.md "$stage/README.md"
          cp native/Cargo.lock "$stage/Cargo.lock"
          archive="$root/LeafMark-Native-v$VERSION-Linux-x86_64.tar.gz"
          tar -C "$root" -czf "$archive" "$(basename "$stage")"
          sha256sum "$archive" > "$archive.sha256"

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "leafmark-native-assets"
          $stage = Join-Path $root "LeafMark-Native-v$env:VERSION-Windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "native\target\release\leafmark-native.exe" (Join-Path $stage "LeafMark-Native.exe")
          Copy-Item "native\README.md" (Join-Path $stage "README.md")
          Copy-Item "native\Cargo.lock" (Join-Path $stage "Cargo.lock")
          $archive = Join-Path $root "LeafMark-Native-v$env:VERSION-Windows-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content "$archive.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/leafmark-native-assets/*.zip
            ${{ runner.temp }}/leafmark-native-assets/*.tar.gz
            ${{ runner.temp }}/leafmark-native-assets/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, build]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Mark failed release
        if: needs.resolve.result != 'success' || needs.build.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg state failure \
            --arg description "Native alpha did not pass both platform builds" \
            --arg context "leafmark/native-alpha-release" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,description:$description,context:$context,target_url:$target_url}' \
            > "$RUNNER_TEMP/status.json"
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"
          exit 1

      - name: Download platform packages
        if: needs.resolve.result == 'success' && needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: leafmark-native-package-*
          path: dist
          merge-multiple: true

      - name: Create prerelease
        if: needs.resolve.result == 'success' && needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          test -f "dist/LeafMark-Native-v$VERSION-Windows-x64.zip"
          test -f "dist/LeafMark-Native-v$VERSION-Linux-x86_64.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "LeafMark Native v$VERSION" \
            --notes-file "native/RELEASE_NOTES_v$VERSION.md" \
            --prerelease

      - name: Mark published release
        if: needs.resolve.result == 'success' && needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg state success \
            --arg description "Windows and Linux Native alpha published" \
            --arg context "leafmark/native-alpha-release" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${{ needs.resolve.outputs.tag }}" \
            '{state:$state,description:$description,context:$context,target_url:$target_url}' \
            > "$RUNNER_TEMP/status.json"
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"

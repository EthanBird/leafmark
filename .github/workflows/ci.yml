name: Validate LeafMark

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leafmark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Test and build frontend
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Test Rust document core
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml `
            --features portable portable_build_disables_registry_integration

      - name: Verify stable 0.7 Windows packaging policy
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (
            $config.bundle.windows.webviewInstallMode.type -ne "offlineInstaller" -or
            $config.bundle.windows.webviewInstallMode.silent -ne $true -or
            $config.bundle.windows.nsis.compression -ne "lzma" -or
            $config.bundle.windows.nsis.installMode -ne "currentUser"
          ) {
            throw "0.7.x must preserve offline WebView2, LZMA and current-user installation."
          }

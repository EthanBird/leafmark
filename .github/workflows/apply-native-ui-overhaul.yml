name: Apply LeafMark Native UI overhaul

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-native-ui-overhaul.yml
      - .github/native-ui-payload/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leafmark-apply-native-ui-overhaul
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/native-three-platform' || github.ref_name == 'agent/native-three-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-three-platform
          fetch-depth: 0
      - name: Restore reviewed source changes
        shell: bash
        run: |
          cat .github/native-ui-payload/part-* | base64 --decode > "$RUNNER_TEMP/native-ui-payload.tar.gz"
          echo '9e835ee00fbfc58e3b10776de5711063470de37d6dc6543ec042aed1438b88ac  '"$RUNNER_TEMP/native-ui-payload.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/native-ui-payload.tar.gz"
          test -s native/apps/leafmark-native/src/main.rs
          test -s native/apps/leafmark-native/build.rs
          test -s native/apps/leafmark-android/src/main.rs
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: native-ui-overhaul
      - name: Format and validate the full Native workspace
        working-directory: native
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo test --workspace --all-targets --locked
          cargo check -p leafmark-native --all-targets --locked
          cargo check -p leafmark-android --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit validated UI overhaul
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/apps/leafmark-native/src/main.rs \
            native/apps/leafmark-native/build.rs \
            native/apps/leafmark-android/src/main.rs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(native): redesign Linux UI and fix platform builds'
          git push origin HEAD:agent/native-three-platform

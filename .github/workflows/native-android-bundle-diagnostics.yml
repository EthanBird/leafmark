name: Diagnose Dioxus Native Android bundle

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-android-bundle-diagnostics.yml
      - native/apps/leafmark-android/**
      - native/Cargo.toml
      - native/Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leafmark-native-android-bundle-diagnostics
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 25.2.9519653

jobs:
  diagnose:
    if: github.head_ref == 'agent/native-three-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-three-platform
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: android-diagnostics
      - name: Install pinned Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Record toolchain and command help
        shell: bash
        run: |
          {
            echo '=== dx version ==='
            dx --version
            echo '=== dx bundle help ==='
            dx bundle --help
            echo '=== rust targets ==='
            rustup target list --installed
            echo '=== Java ==='
            java -version
            echo '=== Android SDK ==='
            sdkmanager --list_installed
            echo '=== Android app manifest ==='
            cat native/apps/leafmark-android/Dioxus.toml
            echo '=== Android Cargo manifest ==='
            cat native/apps/leafmark-android/Cargo.toml
          } > "$RUNNER_TEMP/android-environment.log" 2>&1
      - name: Run Android native bundle and capture all output
        id: bundle
        continue-on-error: true
        working-directory: native/apps/leafmark-android
        shell: bash
        run: |
          set +e
          RUST_BACKTRACE=1 dx bundle \
            --android \
            --renderer native \
            --package-types apk \
            --release \
            --verbose \
            --out-dir "$GITHUB_WORKSPACE/dist/android" \
            > "$RUNNER_TEMP/android-bundle.log" 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record generated files and Gradle logs
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '=== generated files ==='
            find native/apps/leafmark-android native/target dist -maxdepth 8 -type f -printf '%p %s bytes\n' 2>/dev/null | sort
            echo '=== generated directories ==='
            find native/apps/leafmark-android native/target dist -maxdepth 5 -type d -print 2>/dev/null | sort
            echo '=== Gradle reports ==='
            find native/apps/leafmark-android native/target dist -type f \
              \( -name '*.log' -o -name '*.txt' -o -name '*.html' \) -print 2>/dev/null | sort
          } > "$RUNNER_TEMP/android-generated-tree.log" 2>&1
          find native/apps/leafmark-android native/target dist -type f \
            \( -name '*.log' -o -name '*.txt' \) -size -2M -exec sh -c '
              for file do
                printf "\n===== %s =====\n" "$file"
                cat "$file"
              done
            ' sh {} + > "$RUNNER_TEMP/android-secondary-logs.log" 2>&1 || true
      - name: Upload raw Android bundle diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-native-bundle-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/android-environment.log
            ${{ runner.temp }}/android-bundle.log
            ${{ runner.temp }}/android-generated-tree.log
            ${{ runner.temp }}/android-secondary-logs.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when bundle failed
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.bundle.outputs.exit_code }}
        run: test "$EXIT_CODE" = 0

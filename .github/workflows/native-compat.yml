name: Publish native Windows compatibility build

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/verify-native-compat.ps1
      - .github/workflows/native-compat.yml
      - native-compat/**
      - THIRD_PARTY_NOTICES.md
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag; must match native-compat package version
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Serialize with the standard release workflow so both jobs can safely attach
  # assets to the same version tag. This workflow itself never builds Android.
  group: leafmark-release
  cancel-in-progress: false

jobs:
  build-audit-publish:
    name: Native Windows x64 (no WebView or browser frontend)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Keep the three-file portable ZIP independent from the Visual C++
      # redistributable on stripped-down Windows installations.
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Resolve and validate release identity
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Native compatibility releases may only be built from main; got $env:GITHUB_REF."
          }
          if (-not (Test-Path 'native-compat/Cargo.lock')) {
            throw 'native-compat/Cargo.lock must be checked in before publication.'
          }
          $releaseTarget = (git rev-parse HEAD).Trim()
          $metadataArguments = @(
            'metadata',
            '--format-version', '1',
            '--no-deps',
            '--manifest-path', 'native-compat/Cargo.toml',
            '--locked'
          )
          $metadata = cargo @metadataArguments | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'cargo metadata failed.'
          }
          $package = @($metadata.packages | Where-Object {
            $_.name -eq "leafmark-native-compat"
          })
          if ($package.Count -ne 1) {
            throw "Expected exactly one leafmark-native-compat package."
          }

          $version = $package[0].version
          $expectedTag = "v$version"
          $tag = if ([string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
            $expectedTag
          } else {
            $env:REQUESTED_TAG.Trim()
          }
          if ($tag -ne $expectedTag) {
            throw "Release tag '$tag' does not match native-compat version '$expectedTag'."
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag"
          }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_sha=$releaseTarget" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path native-compat/Cargo.toml -- --check

      - name: Test native compatibility crate
        shell: pwsh
        run: |
          cargo test `
            --locked `
            --manifest-path native-compat/Cargo.toml `
            --target x86_64-pc-windows-msvc

      - name: Reject embedded-web dependencies and enforce software rendering
        shell: pwsh
        run: |
          $treePath = Join-Path $env:RUNNER_TEMP "native-compat-cargo-tree.txt"
          cargo tree `
            --locked `
            --manifest-path native-compat/Cargo.toml `
            --target x86_64-pc-windows-msvc `
            --edges normal,build | Tee-Object -FilePath $treePath
          if ($LASTEXITCODE -ne 0) {
            throw "cargo tree failed."
          }

          $tree = Get-Content $treePath -Raw
          $forbiddenWebPackages = @(
            'tauri',
            'tauri-runtime',
            'tauri-runtime-wry',
            'wry',
            'webview2',
            'webview2-com',
            'webview2-com-sys',
            'cef',
            'cef-sys',
            'chromium',
            'electron',
            'libcef',
            'v8',
            'webbrowser'
          )
          $forbiddenGpuPackages = @(
            'eframe',
            'egui',
            'glow',
            'glutin',
            'wgpu',
            'naga'
          )
          foreach ($packageName in $forbiddenWebPackages) {
            $escaped = [regex]::Escape($packageName)
            if ($tree -match "(?im)^[^`r`n]*\b$escaped\s+v[0-9]") {
              throw "Forbidden embedded-web/browser dependency: $packageName"
            }
          }
          foreach ($packageName in $forbiddenGpuPackages) {
            $escaped = [regex]::Escape($packageName)
            if ($tree -match "(?im)^[^`r`n]*\b$escaped\s+v[0-9]") {
              throw "Forbidden GPU backend in the software-rendered compatibility build: $packageName"
            }
          }

          $source = Get-ChildItem native-compat/src -Recurse -Filter '*.rs' |
            ForEach-Object { Get-Content $_.FullName -Raw } |
            Out-String
          $forbiddenSourceMarkers = @(
            'std::process::Command',
            'process::Command',
            'Command::new',
            'ShellExecute',
            'CreateProcess',
            'WinExec',
            'TcpListener',
            'TcpSocket',
            'webbrowser::',
            'cmd.exe',
            'powershell.exe',
            'pwsh.exe'
          )
          foreach ($marker in $forbiddenSourceMarkers) {
            if ($source.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Forbidden terminal/browser/network source marker: $marker"
            }
          }

      - name: Build optimized native compatibility executable
        shell: pwsh
        run: |
          cargo build `
            --locked `
            --release `
            --manifest-path native-compat/Cargo.toml `
            --target x86_64-pc-windows-msvc

      - name: Audit executable and create exact portable ZIP
        id: package
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/scripts/verify-native-compat.ps1" `
            -Executable "native-compat/target/x86_64-pc-windows-msvc/release/leafmark-native-compat.exe" `
            -Version "${{ steps.release.outputs.version }}" `
            -ArchiveDirectory $env:RUNNER_TEMP `
            -GithubOutputPath $env:GITHUB_OUTPUT

      - name: Preserve verified archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeafMark-${{ steps.release.outputs.version }}-Windows-x64-Native-Compat
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Preserve resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: LeafMark-${{ steps.release.outputs.version }}-Native-Compat-Cargo-lock
          path: native-compat/Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Create release when it does not exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ steps.release.outputs.target_sha }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $releaseExists = $false
          try {
            Invoke-RestMethod -Uri $releaseUri -Headers $headers -Method Get | Out-Null
            $releaseExists = $true
          } catch {
            $statusCode = if ($null -ne $_.Exception.Response) {
              [int]$_.Exception.Response.StatusCode
            } else {
              0
            }
            if ($statusCode -ne 404) {
              throw "Failed to query release $env:RELEASE_TAG (HTTP $statusCode): $($_.Exception.Message)"
            }
          }

          if ($releaseExists) {
            git fetch --force origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
            if ($LASTEXITCODE -ne 0) {
              throw "Release exists, but its tag could not be fetched: $env:RELEASE_TAG"
            }
            $tagTarget = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
            if ($tagTarget -ne $env:RELEASE_TARGET) {
              throw "Release $env:RELEASE_TAG targets $tagTarget, not this build's $env:RELEASE_TARGET. Bump the native compatibility version instead of replacing a published asset."
            }
            Write-Host "Using existing release $env:RELEASE_TAG at $tagTarget."
            exit 0
          }

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:RELEASE_TARGET,
            '--title', "LeafMark $env:RELEASE_TAG 原生兼容版",
            '--generate-notes'
          )
          if ($env:RELEASE_TAG.Contains('-')) {
            $arguments += '--prerelease'
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create release $env:RELEASE_TAG."
          }

      - name: Upload native compatibility archive to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
        run: |
          $uploaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt += 1) {
            gh release upload $env:RELEASE_TAG `
              $env:ARCHIVE_PATH `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            if ($attempt -lt 3) {
              Write-Warning "Release upload attempt $attempt failed; retrying."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $uploaded) {
            throw "Failed to upload native compatibility archive after three attempts."
          }

          Write-Host "Published $env:ARCHIVE_PATH to $env:RELEASE_TAG."

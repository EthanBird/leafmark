name: Register native settings once

on:
  push:
    branches: [main]
    paths: [.github/workflows/native-register-settings-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Register settings crate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('native/Cargo.toml')
          text = path.read_text()
          member = '  "crates/leafmark-settings",\n'
          if member not in text:
              marker = '  "crates/leafmark-app",\n'
              if marker not in text:
                  raise SystemExit('leafmark-app workspace marker missing')
              text = text.replace(marker, member + marker)
              path.write_text(text)
          PY
          rm .github/workflows/native-register-settings-once.yml
      - name: Format and verify
        working-directory: native
        run: |
          cargo fmt --all
          cargo test --workspace --all-targets
          cargo check -p leafmark-native --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified registration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Register native settings compatibility"
          git push origin HEAD:main

name: Diagnose normalized LeafMark Native

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/native-normalize-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leafmark-native-normalize-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/native-three-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-three-platform
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Apply known fixes and format
        run: |
          python - <<'PY'
          from pathlib import Path
          markdown = Path('native/crates/leafmark-markdown/src/lib.rs')
          text = markdown.read_text()
          text = text.replace(
              "pub fn slice<'a>(self, source: &'a str) -> Option<&'a str>",
              "pub fn slice(self, source: &str) -> Option<&str>",
              1,
          )
          text = text.replace(
              'assert_eq!(doc.outline[0].range.slice(source), Some("# 标题"));',
              'assert_eq!(doc.outline[0].range.slice(source), Some("# 标题\\n"));',
              1,
          )
          markdown.write_text(text)
          android = Path('native/apps/leafmark-android/src/main.rs')
          text = android.read_text()
          if text.startswith('use std::path::PathBuf;'):
              text = '#[cfg(target_os = "android")]\n' + text
          android.write_text(text)
          PY
          cd native
          cargo fmt --all
      - name: Verify formatting
        id: fmt
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/fmt.log"
      - name: Run all tests
        id: tests
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Check desktop shell
        id: desktop
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo check -p leafmark-native --all-targets 2>&1 | tee "$RUNNER_TEMP/desktop.log"
      - name: Check Android shell on host
        id: android
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo check -p leafmark-android --all-targets 2>&1 | tee "$RUNNER_TEMP/android.log"
      - name: Run strict Clippy
        id: clippy
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Write result summary
        if: ${{ always() }}
        env:
          FMT: ${{ steps.fmt.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DESKTOP: ${{ steps.desktop.outcome }}
          ANDROID: ${{ steps.android.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          printf 'fmt=%s\ntests=%s\ndesktop=%s\nandroid=%s\nclippy=%s\n' \
            "$FMT" "$TESTS" "$DESKTOP" "$ANDROID" "$CLIPPY" \
            > "$RUNNER_TEMP/result.txt"
      - name: Upload strict diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-normalize-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result.txt
            ${{ runner.temp }}/fmt.log
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/desktop.log
            ${{ runner.temp }}/android.log
            ${{ runner.temp }}/clippy.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when any strict check failed
        if: ${{ always() }}
        env:
          FMT: ${{ steps.fmt.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DESKTOP: ${{ steps.desktop.outcome }}
          ANDROID: ${{ steps.android.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          test "$FMT" = success
          test "$TESTS" = success
          test "$DESKTOP" = success
          test "$ANDROID" = success
          test "$CLIPPY" = success

name: Export LeafMark Native source

on:
  push:
    branches: [agent/native-three-platform]
    paths:
      - .github/workflows/export-native-source.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-native-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/native-three-platform' || github.ref_name == 'agent/native-three-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-three-platform
      - name: Package source snapshot
        run: |
          tar --exclude='native/target' \
              --exclude='.git' \
              -czf "$RUNNER_TEMP/leafmark-native-source.tar.gz" \
              native \
              .github/workflows/native-three-platform.yml
      - uses: actions/upload-artifact@v4
        with:
          name: leafmark-native-source-${{ github.sha }}
          path: ${{ runner.temp }}/leafmark-native-source.tar.gz
          if-no-files-found: error
          retention-days: 1

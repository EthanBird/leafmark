name: Publish Windows release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - src-tauri/tauri.conf.json

permissions:
  contents: write

concurrency:
  group: leafmark-release
  cancel-in-progress: false

jobs:
  release-windows:
    if: startsWith(github.event.head_commit.message, 'Release LeafMark v')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Check frontend
        run: npm run typecheck

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: LeafMark v__VERSION__
          releaseBody: |
            LeafMark v0.2.0

            - 支持从 Windows 资源管理器右键、打开方式和双击打开 Markdown 文件
            - 设置中可注册 LeafMark 并进入系统默认应用确认页
            - 新增最近打开历史、搜索与收藏
            - 自动保留独立文档副本，源文件删除后仍可阅读、编辑和导出
            - 收藏副本不受批量清除历史影响

            下载下方 NSIS 安装程序即可安装。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          retryAttempts: 2
          args: --bundles nsis
          releaseAssetNamePattern: LeafMark_[version]_[arch][setup].[ext]

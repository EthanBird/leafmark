name: Publish Windows, Linux and Android release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - docs/windows-portable.md
      - index.html
      - package.json
      - README.md
      - src/**
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - src-tauri/build.rs
      - src-tauri/gen/android/**
      - src-tauri/src/**
      - src-tauri/tauri.conf.json
      - src-tauri/windows-app-manifest.xml
      - THIRD_PARTY_NOTICES.md

permissions:
  contents: write

concurrency:
  group: leafmark-release
  cancel-in-progress: false

jobs:
  release-windows:
    if: startsWith(github.event.head_commit.message, 'Release LeafMark v')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare optional Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "{}" | Set-Content src-tauri/tauri.signing.conf.json -Encoding utf8
            "WINDOWS_CERTIFICATE_CONFIGURED=false" |
              Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Warning "No Authenticode certificate configured; publishing an unsigned installer."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is set."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "leafmark-codesign.pfx"
          $encoded = $env:WINDOWS_CERTIFICATE `
            -replace "-----BEGIN CERTIFICATE-----", "" `
            -replace "-----END CERTIFICATE-----", "" `
            -replace "\s", ""
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encoded))

          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -Force `
            -AsPlainText
          $certificates = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $pfxPath -Force

          if (-not $certificate) {
            throw "The imported PFX does not contain a code-signing private key."
          }

          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $timestampUrl
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 |
            Set-Content src-tauri/tauri.signing.conf.json -Encoding utf8
          "WINDOWS_CERTIFICATE_CONFIGURED=true" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_TIMESTAMP_URL_RESOLVED=$timestampUrl" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Check frontend
        run: npm run typecheck

      - name: Test native Windows integration
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml `
            --features portable portable_build_disables_registry_integration
          $regExeCalls = Select-String `
            -Path src-tauri/src/*.rs `
            -SimpleMatch 'Command::new("reg.exe")'
          if ($regExeCalls) {
            throw "Windows integration must not spawn reg.exe."
          }

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: LeafMark v__VERSION__
          releaseBody: |
            - Windows x64 WebView2 兼容安装版内置轻量 Bootstrapper；系统缺少 WebView2 Runtime 时会自动联网安装，不内置约 127–180 MB 的完整 Runtime
            - NSIS 安装版固定为当前用户安装，不请求管理员权限；已安装 WebView2 的系统不会重复安装
            - Windows x64 免安装便携 ZIP：解压后直接运行 LeafMark.exe，不运行安装程序，也不请求管理员权限；便携版仍要求系统已有 WebView2 Runtime
            - 便携版使用独立 portable 编译模式，LeafMark 的文件关联注册表查询、写入和默认应用入口均不会编译进程序
            - 设置页会明确显示“Windows 便携模式”，且不提供任何注册文件关联的按钮；仍可在应用内打开文件或把 Markdown 拖到 EXE 上

            缺少 WebView2 的电脑请下载 WebView2 Setup；免安装使用请下载 Portable ZIP。Windows 未签名构建可能触发 SmartScreen 提示。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          retryAttempts: 2
          args: --bundles nsis --config src-tauri/tauri.signing.conf.json
          releaseAssetNamePattern: LeafMark_[version]_Windows_[arch]_WebView2_Setup[ext]

      - name: Verify installer
        shell: pwsh
        run: |
          $app = Get-Item src-tauri/target/release/leafmark.exe
          $bytes = [IO.File]::ReadAllBytes($app.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "LeafMark executable is not a Windows GUI subsystem binary: $subsystem"
          }

          $installer = Get-ChildItem `
            -Path src-tauri/target/release/bundle/nsis `
            -Filter *.exe |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not generated."
          }

          $signature = Get-AuthenticodeSignature $installer.FullName
          if (
            $env:WINDOWS_CERTIFICATE_CONFIGURED -eq "true" -and
            $signature.Status -ne "Valid"
          ) {
            throw "Invalid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }
          if ($env:WINDOWS_CERTIFICATE_CONFIGURED -ne "true") {
            Write-Warning "Publishing unsigned installer: $($installer.Name)"
          }

          $version = node -p "require('./package.json').version"
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build portable executable
        shell: pwsh
        run: |
          npm run tauri -- build `
            --no-bundle `
            --features portable `
            --config src-tauri/tauri.signing.conf.json `
            --ci

          $portable = Get-Item src-tauri/target/release/leafmark.exe
          if ($env:WINDOWS_CERTIFICATE_CONFIGURED -eq "true") {
            $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if (-not $signTool) {
              $signTool = Get-ChildItem `
                -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
                -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1
            }
            if (-not $signTool) {
              throw "signtool.exe is required to sign the portable executable."
            }
            $signToolPath = if ($signTool.Source) { $signTool.Source } else { $signTool.FullName }
            & $signToolPath sign `
              /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT `
              /fd SHA256 `
              /td SHA256 `
              /tr $env:WINDOWS_TIMESTAMP_URL_RESOLVED `
              $portable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to Authenticode-sign the portable executable."
            }
          }

      - name: Verify and package portable build
        shell: pwsh
        run: |
          $portable = Get-Item src-tauri/target/release/leafmark.exe
          $bytes = [IO.File]::ReadAllBytes($portable.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($machine -ne 0x8664) {
            throw "Portable executable is not x64: 0x$($machine.ToString('x4'))"
          }
          if ($subsystem -ne 2) {
            throw "Portable executable is not a Windows GUI subsystem binary: $subsystem"
          }

          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [Text.Encoding]::Unicode.GetString($bytes)
          foreach ($forbidden in @(
            "Software\RegisteredApplications",
            "LeafMark.Markdown",
            "ms-settings:defaultapps"
          )) {
            if ($ascii.Contains($forbidden) -or $unicode.Contains($forbidden)) {
              throw "Portable executable contains forbidden registry integration marker: $forbidden"
            }
          }

          $manifestTool = Get-Command mt.exe -ErrorAction SilentlyContinue
          if (-not $manifestTool) {
            $manifestTool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $manifestTool) {
            throw "Windows SDK mt.exe is required to verify the portable application manifest."
          }
          $manifestToolPath = if ($manifestTool.Source) { $manifestTool.Source } else { $manifestTool.FullName }
          $manifestPath = Join-Path $env:RUNNER_TEMP "LeafMark-portable.manifest.xml"
          $inputResource = "-inputresource:$($portable.FullName);#1"
          & $manifestToolPath -nologo $inputResource "-out:$manifestPath"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $manifestPath)) {
            throw "Failed to extract the portable executable RT_MANIFEST."
          }
          [xml]$manifest = Get-Content $manifestPath -Raw
          $executionLevels = @($manifest.SelectNodes("//*[local-name()='requestedExecutionLevel']"))
          if ($executionLevels.Count -ne 1) {
            throw "Portable executable must declare exactly one requestedExecutionLevel."
          }
          if (
            $executionLevels[0].GetAttribute("level") -ne "asInvoker" -or
            $executionLevels[0].GetAttribute("uiAccess") -ne "false"
          ) {
            throw "Portable executable must request asInvoker with uiAccess=false."
          }

          $signature = Get-AuthenticodeSignature $portable.FullName
          if (
            $env:WINDOWS_CERTIFICATE_CONFIGURED -eq "true" -and
            $signature.Status -ne "Valid"
          ) {
            throw "Invalid portable Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }

          function Get-LeafMarkRegistrySnapshot {
            $items = [ordered]@{}
            foreach ($path in @(
              "HKCU:\Software\Classes\LeafMark.Markdown",
              "HKCU:\Software\LeafMark"
            )) {
              $items[$path] = Test-Path $path
            }
            foreach ($entry in @(
              @{ SubKey = "Software\RegisteredApplications"; Name = "LeafMark" },
              @{ SubKey = "Software\Classes\.md\OpenWithProgids"; Name = "LeafMark.Markdown" },
              @{ SubKey = "Software\Classes\.markdown\OpenWithProgids"; Name = "LeafMark.Markdown" }
            )) {
              $registryKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                $entry.SubKey,
                $false
              )
              try {
                $value = if ($null -eq $registryKey) {
                  $null
                } else {
                  $registryKey.GetValue($entry.Name, $null)
                }
              } finally {
                if ($null -ne $registryKey) {
                  $registryKey.Dispose()
                }
              }
              $items["HKCU:\$($entry.SubKey)::$($entry.Name)"] = $value
            }
            return ($items | ConvertTo-Json -Compress)
          }

          $registryBefore = Get-LeafMarkRegistrySnapshot
          $process = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Portable executable exited during the startup smoke test: $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
          $registryAfter = Get-LeafMarkRegistrySnapshot
          if ($registryAfter -ne $registryBefore) {
            throw "Portable startup changed LeafMark registry state.`nBefore: $registryBefore`nAfter: $registryAfter"
          }

          $version = node -p "require('./package.json').version"
          $stage = Join-Path $env:RUNNER_TEMP "LeafMark-$version-Windows-x64-Portable"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $portable.FullName (Join-Path $stage "LeafMark.exe")
          Copy-Item docs/windows-portable.md (Join-Path $stage "README.md")
          Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $stage "THIRD_PARTY_NOTICES.md")

          $archive = Join-Path $env:RUNNER_TEMP "LeafMark_${version}_Windows_x64_Portable.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $expected = @("LeafMark.exe", "README.md", "THIRD_PARTY_NOTICES.md") | Sort-Object
          if (Compare-Object $entries $expected) {
            throw "Portable ZIP has unexpected entries: $($entries -join ', ')"
          }
          Get-FileHash -Algorithm SHA256 $archive | Format-List
          Get-Item $archive | Format-List Name,Length,FullName
          "PORTABLE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $uploaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt += 1) {
            gh release upload $env:RELEASE_TAG `
              $env:PORTABLE_ARCHIVE `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            if ($attempt -lt 3) {
              Write-Warning "Portable upload attempt $attempt failed; retrying."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $uploaded) {
            throw "Failed to upload the portable archive after three attempts."
          }

      - name: Remember release tag
        shell: pwsh
        run: Write-Host "Windows installer and portable archive uploaded to draft release $env:RELEASE_TAG"

  release-android:
    needs: release-windows
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare stable Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/leafmark-release.jks"
          base64 --decode .github/leafmark-community-release.jks.b64 > "$keystore_path"
          chmod 600 "$keystore_path"

          export ANDROID_KEYSTORE_PASSWORD='leafmark-community-release-v1'
          export ANDROID_KEY_ALIAS='leafmark-community'
          export ANDROID_KEY_PASSWORD='leafmark-community-release-v1'

          certificate_report="$(keytool -J-Duser.language=en -list -v \
            -keystore "$keystore_path" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD)"
          actual_certificate="$(printf '%s\n' "$certificate_report" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d '[:space:]:')"
          expected_certificate="$(tr '[:upper:]' '[:lower:]' \
            < .github/android-signing-cert.sha256 |
            tr -d '[:space:]:')"
          if [[ ! "$expected_certificate" =~ ^[0-9a-f]{64}$ ]]; then
            echo '.github/android-signing-cert.sha256 must contain the pinned release certificate fingerprint.'
            exit 1
          fi
          if [[ "$actual_certificate" != "$expected_certificate" ]]; then
            printf 'Configured keystore certificate does not match the pinned fingerprint.\n'
            exit 1
          fi
          {
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'ANDROID_EXPECTED_CERT_SHA256=%s\n' "$expected_certificate"
          } >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: android
          tagName: v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          args: --apk --target aarch64 --split-per-abi
          releaseAssetNamePattern: LeafMark_[version]_Android_[arch].[ext]

      - name: Verify ARM64 release APK
        shell: bash
        run: |
          mapfile -t apks < <(
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' ! -name '*unsigned*'
          )
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected exactly one signed APK, found %s\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          apk="${apks[0]}"
          mapfile -t abis < <(
            zipinfo -1 "$apk" |
              awk -F/ '/^lib\/[^/]+\/[^/]+\.so$/ { print $2 }' |
              sort -u
          )
          if [[ "${abis[*]}" != "arm64-v8a" ]]; then
            printf 'Expected only arm64-v8a, found: %s\n' "${abis[*]:-none}"
            exit 1
          fi

          size_bytes="$(stat -c '%s' "$apk")"
          max_bytes="$((16 * 1024 * 1024))"
          if (( size_bytes > max_bytes )); then
            printf 'APK is still too large: %s bytes (limit %s)\n' \
              "$size_bytes" "$max_bytes"
            exit 1
          fi

          manifest_dump="$(mktemp)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest print "$apk" > "$manifest_dump"
          for required in \
            android.intent.action.VIEW \
            android.intent.action.EDIT \
            android.intent.action.SEND \
            android.intent.action.SEND_MULTIPLE \
            text/markdown \
            text/plain; do
            if ! grep -Fq "$required" "$manifest_dump"; then
              printf 'Android manifest is missing required entry: %s\n' "$required"
              cat "$manifest_dump"
              exit 1
            fi
          done
          if grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' "$manifest_dump"; then
            echo 'Phone build must not advertise an Android TV launcher.'
            exit 1
          fi

          certificate_report="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$apk")"
          printf '%s\n' "$certificate_report"
          apk_certificate="$(printf '%s\n' "$certificate_report" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d '[:space:]:')"
          if [[ "$apk_certificate" != "$ANDROID_EXPECTED_CERT_SHA256" ]]; then
            printf 'APK certificate mismatch: expected %s, found %s\n' \
              "$ANDROID_EXPECTED_CERT_SHA256" "${apk_certificate:-none}"
            exit 1
          fi

          application_id="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest application-id "$apk")"
          version_name="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest version-name "$apk")"
          version_code="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest version-code "$apk")"
          expected_version="$(node -p "require('./package.json').version")"
          if [[ "$application_id" != "com.leafmark.desktop" ]]; then
            printf 'Unexpected Android application id: %s\n' "$application_id"
            exit 1
          fi
          if [[ "$version_name" != "$expected_version" ]]; then
            printf 'Unexpected Android version: expected %s, found %s\n' \
              "$expected_version" "$version_name"
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[0-9]+$ ]] || (( version_code <= 6000 )); then
            printf 'Android versionCode must be greater than the last debug-signed release (6000), found %s\n' \
              "$version_code"
            exit 1
          fi
          sha256sum "$apk"
          du -h "$apk"

  release-linux:
    needs: release-windows
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend and native core
        run: |
          npm test
          npm run typecheck
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and upload Linux bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          args: --bundles appimage,deb
          releaseAssetNamePattern: LeafMark_[version]_Linux_[arch].[ext]

      - name: Verify Linux bundles and launch
        shell: bash
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          deb="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          if [[ -z "$appimage" || -z "$deb" ]]; then
            echo "Expected both AppImage and Debian artifacts."
            exit 1
          fi

          dpkg-deb --info "$deb"
          if ldd src-tauri/target/release/leafmark | grep -q 'not found'; then
            ldd src-tauri/target/release/leafmark
            exit 1
          fi

          set +e
          GDK_BACKEND=x11 timeout 15s xvfb-run --auto-servernum src-tauri/target/release/leafmark \
            > /tmp/leafmark-linux-smoke.log 2>&1
          status="$?"
          set -e
          cat /tmp/leafmark-linux-smoke.log
          if [[ "$status" -ne 124 ]]; then
            echo "Linux GUI did not remain healthy during the 15-second smoke test (status $status)."
            exit 1
          fi

          sha256sum "$appimage" "$deb"
          du -h "$appimage" "$deb"

  publish-release:
    needs:
      - release-windows
      - release-android
      - release-linux
    if: >-
      ${{
        always() &&
        needs.release-windows.result == 'success' &&
        (needs.release-android.result == 'success' || needs.release-android.result == 'skipped') &&
        (needs.release-linux.result == 'success' || needs.release-linux.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release edit "v$version" --draft=false --repo "$GITHUB_REPOSITORY"

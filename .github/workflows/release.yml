name: Publish Windows, Linux and Android release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - index.html
      - package.json
      - src/**
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - src-tauri/gen/android/**
      - src-tauri/src/**
      - src-tauri/tauri.conf.json

permissions:
  contents: write

concurrency:
  group: leafmark-release
  cancel-in-progress: false

jobs:
  release-windows:
    if: startsWith(github.event.head_commit.message, 'Release LeafMark v')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare optional Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "{}" | Set-Content src-tauri/tauri.signing.conf.json -Encoding utf8
            "WINDOWS_CERTIFICATE_CONFIGURED=false" |
              Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Warning "No Authenticode certificate configured; publishing an unsigned installer."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is set."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "leafmark-codesign.pfx"
          $encoded = $env:WINDOWS_CERTIFICATE `
            -replace "-----BEGIN CERTIFICATE-----", "" `
            -replace "-----END CERTIFICATE-----", "" `
            -replace "\s", ""
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encoded))

          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -Force `
            -AsPlainText
          $certificates = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $pfxPath -Force

          if (-not $certificate) {
            throw "The imported PFX does not contain a code-signing private key."
          }

          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $timestampUrl
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 |
            Set-Content src-tauri/tauri.signing.conf.json -Encoding utf8
          "WINDOWS_CERTIFICATE_CONFIGURED=true" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Check frontend
        run: npm run typecheck

      - name: Test native Windows integration
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          $regExeCalls = Select-String `
            -Path src-tauri/src/*.rs `
            -SimpleMatch 'Command::new("reg.exe")'
          if ($regExeCalls) {
            throw "Windows integration must not spawn reg.exe."
          }

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: LeafMark v__VERSION__
          releaseBody: |
            - 修复全平台 PDF 导出未渲染 Mermaid：长页与标准分页模式现在都会把 Mermaid 图表嵌入为清晰的矢量 SVG
            - Mermaid 图表会内联主题样式，并把 pdfmake 不兼容的 HTML 标签转换为 SVG 文字；中文节点也能随文档字体清晰输出
            - 图表会按实际嵌入 PDF 的系统字体计算布局，避免中文或自定义字体造成标签溢出；导出进度会显示 Mermaid 矢量化状态
            - 单个 Mermaid 语法错误会回退为可读源码，不再中止整份 PDF；正文仍为可搜索、可复制的真实文字
            - 文档库右键菜单新增“移动文档到…”，可选择库内任意文件夹；同目录和同名冲突会安全阻止，不覆盖文件
            - Agent 新增受文档编辑权限控制的 move_document 工具；Agent 版本历史可撤销、重做移动并同步历史与收藏来源路径

            Android 请下载 ARM64 APK；Windows 请下载 NSIS 安装程序；Linux 可选择 AppImage 或 .deb。
            Android APK 继续使用 v0.7.0 起固定的社区更新证书，可直接覆盖更新；该公开证书不提供私钥保密或发布者真实性，请只从本项目官方 GitHub Releases 下载。Windows 未签名构建可能触发 SmartScreen 提示。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          retryAttempts: 2
          args: --bundles nsis --config src-tauri/tauri.signing.conf.json
          releaseAssetNamePattern: LeafMark_[version]_[arch][setup].[ext]

      - name: Verify installer
        shell: pwsh
        run: |
          $app = Get-Item src-tauri/target/release/leafmark.exe
          $bytes = [IO.File]::ReadAllBytes($app.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "LeafMark executable is not a Windows GUI subsystem binary: $subsystem"
          }

          $installer = Get-ChildItem `
            -Path src-tauri/target/release/bundle/nsis `
            -Filter *.exe |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not generated."
          }

          $signature = Get-AuthenticodeSignature $installer.FullName
          if (
            $env:WINDOWS_CERTIFICATE_CONFIGURED -eq "true" -and
            $signature.Status -ne "Valid"
          ) {
            throw "Invalid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }
          if ($env:WINDOWS_CERTIFICATE_CONFIGURED -ne "true") {
            Write-Warning "Publishing unsigned installer: $($installer.Name)"
          }

          $version = node -p "require('./package.json').version"
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Remember release tag
        shell: pwsh
        run: Write-Host "Windows artifact uploaded to draft release $env:RELEASE_TAG"

  release-android:
    needs: release-windows
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare stable Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/leafmark-release.jks"
          base64 --decode .github/leafmark-community-release.jks.b64 > "$keystore_path"
          chmod 600 "$keystore_path"

          export ANDROID_KEYSTORE_PASSWORD='leafmark-community-release-v1'
          export ANDROID_KEY_ALIAS='leafmark-community'
          export ANDROID_KEY_PASSWORD='leafmark-community-release-v1'

          certificate_report="$(keytool -J-Duser.language=en -list -v \
            -keystore "$keystore_path" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD)"
          actual_certificate="$(printf '%s\n' "$certificate_report" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d '[:space:]:')"
          expected_certificate="$(tr '[:upper:]' '[:lower:]' \
            < .github/android-signing-cert.sha256 |
            tr -d '[:space:]:')"
          if [[ ! "$expected_certificate" =~ ^[0-9a-f]{64}$ ]]; then
            echo '.github/android-signing-cert.sha256 must contain the pinned release certificate fingerprint.'
            exit 1
          fi
          if [[ "$actual_certificate" != "$expected_certificate" ]]; then
            printf 'Configured keystore certificate does not match the pinned fingerprint.\n'
            exit 1
          fi
          {
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'ANDROID_EXPECTED_CERT_SHA256=%s\n' "$expected_certificate"
          } >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: android
          tagName: v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          args: --apk --target aarch64 --split-per-abi
          releaseAssetNamePattern: LeafMark_[version]_Android_[arch].[ext]

      - name: Verify ARM64 release APK
        shell: bash
        run: |
          mapfile -t apks < <(
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' ! -name '*unsigned*'
          )
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected exactly one signed APK, found %s\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          apk="${apks[0]}"
          mapfile -t abis < <(
            zipinfo -1 "$apk" |
              awk -F/ '/^lib\/[^/]+\/[^/]+\.so$/ { print $2 }' |
              sort -u
          )
          if [[ "${abis[*]}" != "arm64-v8a" ]]; then
            printf 'Expected only arm64-v8a, found: %s\n' "${abis[*]:-none}"
            exit 1
          fi

          size_bytes="$(stat -c '%s' "$apk")"
          max_bytes="$((16 * 1024 * 1024))"
          if (( size_bytes > max_bytes )); then
            printf 'APK is still too large: %s bytes (limit %s)\n' \
              "$size_bytes" "$max_bytes"
            exit 1
          fi

          manifest_dump="$(mktemp)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest print "$apk" > "$manifest_dump"
          for required in \
            android.intent.action.VIEW \
            android.intent.action.EDIT \
            android.intent.action.SEND \
            android.intent.action.SEND_MULTIPLE \
            text/markdown \
            text/plain; do
            if ! grep -Fq "$required" "$manifest_dump"; then
              printf 'Android manifest is missing required entry: %s\n' "$required"
              cat "$manifest_dump"
              exit 1
            fi
          done
          if grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' "$manifest_dump"; then
            echo 'Phone build must not advertise an Android TV launcher.'
            exit 1
          fi

          certificate_report="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$apk")"
          printf '%s\n' "$certificate_report"
          apk_certificate="$(printf '%s\n' "$certificate_report" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d '[:space:]:')"
          if [[ "$apk_certificate" != "$ANDROID_EXPECTED_CERT_SHA256" ]]; then
            printf 'APK certificate mismatch: expected %s, found %s\n' \
              "$ANDROID_EXPECTED_CERT_SHA256" "${apk_certificate:-none}"
            exit 1
          fi

          application_id="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest application-id "$apk")"
          version_name="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest version-name "$apk")"
          version_code="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest version-code "$apk")"
          expected_version="$(node -p "require('./package.json').version")"
          if [[ "$application_id" != "com.leafmark.desktop" ]]; then
            printf 'Unexpected Android application id: %s\n' "$application_id"
            exit 1
          fi
          if [[ "$version_name" != "$expected_version" ]]; then
            printf 'Unexpected Android version: expected %s, found %s\n' \
              "$expected_version" "$version_name"
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[0-9]+$ ]] || (( version_code <= 6000 )); then
            printf 'Android versionCode must be greater than the last debug-signed release (6000), found %s\n' \
              "$version_code"
            exit 1
          fi
          sha256sum "$apk"
          du -h "$apk"

  release-linux:
    needs: release-windows
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend and native core
        run: |
          npm test
          npm run typecheck
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and upload Linux bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          args: --bundles appimage,deb
          releaseAssetNamePattern: LeafMark_[version]_Linux_[arch].[ext]

      - name: Verify Linux bundles and launch
        shell: bash
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          deb="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          if [[ -z "$appimage" || -z "$deb" ]]; then
            echo "Expected both AppImage and Debian artifacts."
            exit 1
          fi

          dpkg-deb --info "$deb"
          if ldd src-tauri/target/release/leafmark | grep -q 'not found'; then
            ldd src-tauri/target/release/leafmark
            exit 1
          fi

          set +e
          GDK_BACKEND=x11 timeout 15s xvfb-run --auto-servernum src-tauri/target/release/leafmark \
            > /tmp/leafmark-linux-smoke.log 2>&1
          status="$?"
          set -e
          cat /tmp/leafmark-linux-smoke.log
          if [[ "$status" -ne 124 ]]; then
            echo "Linux GUI did not remain healthy during the 15-second smoke test (status $status)."
            exit 1
          fi

          sha256sum "$appimage" "$deb"
          du -h "$appimage" "$deb"

  publish-release:
    needs:
      - release-windows
      - release-android
      - release-linux
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release edit "v$version" --draft=false --repo "$GITHUB_REPOSITORY"

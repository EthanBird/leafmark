name: Publish Windows, Linux and Android release

# A release stays draft until every platform artifact has been built, checked,
# uploaded, and verified against GitHub's recorded SHA-256 digest. Release pushes
# are deliberately gated by the exact "Release LeafMark v<package version>" title.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json (for example, 0.8.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: leafmark-release
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release LeafMark v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source and version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'Releases must run from main, got %s.\n' "$GITHUB_REF"
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          package_lock_version="$(node -p "require('./package-lock.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          for actual in "$package_lock_version" "$tauri_version" "$cargo_version"; do
            if [[ "$actual" != "$version" ]]; then
              printf 'Version mismatch: package.json=%s, other manifest=%s.\n' "$version" "$actual"
              exit 1
            fi
          done

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_VERSION" != "$version" ]]; then
            printf 'Dispatch version %s does not match package.json %s.\n' \
              "$REQUESTED_VERSION" "$version"
            exit 1
          fi

          expected_subject="Release LeafMark v$version"
          actual_subject="$(git log -1 --pretty=%s)"
          if [[ "$actual_subject" != "$expected_subject" ]]; then
            printf 'Release commit title must be exactly "%s", got "%s".\n' \
              "$expected_subject" "$actual_subject"
            exit 1
          fi

      - name: Pin draft release to this main commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"

          mapfile -t releases < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft, .target_commitish] | @tsv"
          )
          if [[ "${#releases[@]}" -gt 1 ]]; then
            printf 'Found multiple releases for %s; refusing to guess.\n' "$tag"
            exit 1
          fi

          if [[ "${#releases[@]}" -eq 1 ]]; then
            IFS=$'\t' read -r release_id is_draft old_target <<< "${releases[0]}"
            if [[ "$is_draft" != "true" ]]; then
              printf '%s is already published; refusing to replace it.\n' "$tag"
              exit 1
            fi
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft=true \
              -F prerelease=false >/dev/null
            printf 'Reused draft %s and moved target from %s to %s.\n' \
              "$release_id" "$old_target" "$GITHUB_SHA"
          else
            release_id="$(
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$tag" \
                -f target_commitish="$GITHUB_SHA" \
                -f name="LeafMark v$version" \
                -F draft=true \
                -F prerelease=false \
                -F generate_release_notes=true \
                --jq .id
            )"
            printf 'Created draft %s for %s.\n' "$release_id" "$GITHUB_SHA"
          fi

          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  release-windows:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows

      - name: Prepare optional Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "{}" | Set-Content src-tauri/tauri.signing.conf.json -Encoding utf8
            "WINDOWS_CERTIFICATE_CONFIGURED=false" |
              Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Warning "No Authenticode certificate configured; publishing an unsigned installer."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is set."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "leafmark-codesign.pfx"
          $encoded = $env:WINDOWS_CERTIFICATE `
            -replace "-----BEGIN CERTIFICATE-----", "" `
            -replace "-----END CERTIFICATE-----", "" `
            -replace "\s", ""
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encoded))

          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -Force `
            -AsPlainText
          $certificates = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $pfxPath -Force

          if (-not $certificate) {
            throw "The imported PFX does not contain a code-signing private key."
          }

          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $timestampUrl
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 |
            Set-Content src-tauri/tauri.signing.conf.json -Encoding utf8
          "WINDOWS_CERTIFICATE_CONFIGURED=true" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Check frontend
        run: npm run typecheck

      - name: Test native Windows integration
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          $regExeCalls = Select-String `
            -Path src-tauri/src/*.rs `
            -SimpleMatch 'Command::new("reg.exe")'
          if ($regExeCalls) {
            throw "Windows integration must not spawn reg.exe."
          }

      - name: Build NSIS installer
        run: npx tauri build --ci --bundles nsis --config src-tauri/tauri.signing.conf.json

      - name: Verify installer
        shell: pwsh
        run: |
          $app = Get-Item src-tauri/target/release/leafmark.exe
          $bytes = [IO.File]::ReadAllBytes($app.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "LeafMark executable is not a Windows GUI subsystem binary: $subsystem"
          }

          $installer = Get-ChildItem `
            -Path src-tauri/target/release/bundle/nsis `
            -Filter *.exe |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not generated."
          }

          $signature = Get-AuthenticodeSignature $installer.FullName
          if (
            $env:WINDOWS_CERTIFICATE_CONFIGURED -eq "true" -and
            $signature.Status -ne "Valid"
          ) {
            throw "Invalid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }
          if ($env:WINDOWS_CERTIFICATE_CONFIGURED -ne "true") {
            Write-Warning "Publishing unsigned installer: $($installer.Name)"
          }

          $version = node -p "require('./package.json').version"
          $assetName = "LeafMark_${version}_x64-setup.exe"
          $assetDir = Join-Path $env:RUNNER_TEMP "leafmark-release-assets"
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          $assetPath = Join-Path $assetDir $assetName
          Copy-Item $installer.FullName $assetPath -Force
          $asset = Get-Item $assetPath
          if ($asset.Length -lt 1MB) {
            throw "NSIS installer is unexpectedly small: $($asset.Length) bytes"
          }
          $sha256 = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "WINDOWS_ASSET_NAME=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_ASSET_PATH=$assetPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_ASSET_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload and verify Windows asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?per_page=100" |
            ConvertFrom-Json
          $oldAsset = $assets | Where-Object Name -eq $env:WINDOWS_ASSET_NAME
          if ($oldAsset) {
            gh api --method DELETE `
              "repos/$env:GITHUB_REPOSITORY/releases/assets/$($oldAsset.id)"
          }
          $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$env:WINDOWS_ASSET_NAME"
          $uploadJson = curl.exe `
            --fail-with-body `
            --silent `
            --show-error `
            --location `
            --request POST `
            --header "Accept: application/vnd.github+json" `
            --header "Authorization: Bearer $env:GH_TOKEN" `
            --header "X-GitHub-Api-Version: 2022-11-28" `
            --header "Content-Type: application/octet-stream" `
            --data-binary "@$env:WINDOWS_ASSET_PATH" `
            $uploadUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Windows asset upload failed with curl exit code $LASTEXITCODE."
          }
          $asset = $uploadJson | ConvertFrom-Json
          $expectedDigest = "sha256:$env:WINDOWS_ASSET_SHA256"
          if (
            $asset.name -ne $env:WINDOWS_ASSET_NAME -or
            $asset.state -ne "uploaded" -or
            $asset.digest -ne $expectedDigest
          ) {
            throw "Windows asset verification failed: $($asset.state) $($asset.digest)"
          }

  release-android:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare stable Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/leafmark-release.jks"
          base64 --decode .github/leafmark-community-release.jks.b64 > "$keystore_path"
          chmod 600 "$keystore_path"

          export ANDROID_KEYSTORE_PASSWORD='leafmark-community-release-v1'
          export ANDROID_KEY_ALIAS='leafmark-community'
          export ANDROID_KEY_PASSWORD='leafmark-community-release-v1'

          certificate_report="$(keytool -J-Duser.language=en -list -v \
            -keystore "$keystore_path" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD)"
          actual_certificate="$(printf '%s\n' "$certificate_report" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d '[:space:]:')"
          expected_certificate="$(tr '[:upper:]' '[:lower:]' \
            < .github/android-signing-cert.sha256 |
            tr -d '[:space:]:')"
          if [[ ! "$expected_certificate" =~ ^[0-9a-f]{64}$ ]]; then
            echo '.github/android-signing-cert.sha256 must contain the pinned release certificate fingerprint.'
            exit 1
          fi
          if [[ "$actual_certificate" != "$expected_certificate" ]]; then
            printf 'Configured keystore certificate does not match the pinned fingerprint.\n'
            exit 1
          fi
          {
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'ANDROID_EXPECTED_CERT_SHA256=%s\n' "$expected_certificate"
          } >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust Android build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-android-arm64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        run: npx tauri android build --ci --apk --target aarch64 --split-per-abi

      - name: Verify ARM64 release APK
        shell: bash
        run: |
          mapfile -t apks < <(
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' ! -name '*unsigned*'
          )
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected exactly one signed APK, found %s\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          apk="${apks[0]}"
          mapfile -t abis < <(
            zipinfo -1 "$apk" |
              awk -F/ '/^lib\/[^/]+\/[^/]+\.so$/ { print $2 }' |
              sort -u
          )
          if [[ "${abis[*]}" != "arm64-v8a" ]]; then
            printf 'Expected only arm64-v8a, found: %s\n' "${abis[*]:-none}"
            exit 1
          fi

          size_bytes="$(stat -c '%s' "$apk")"
          max_bytes="$((16 * 1024 * 1024))"
          if (( size_bytes > max_bytes )); then
            printf 'APK is still too large: %s bytes (limit %s)\n' \
              "$size_bytes" "$max_bytes"
            exit 1
          fi

          manifest_dump="$(mktemp)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest print "$apk" > "$manifest_dump"
          for required in \
            android.intent.action.VIEW \
            android.intent.action.EDIT \
            android.intent.action.SEND \
            android.intent.action.SEND_MULTIPLE \
            text/markdown \
            text/plain \
            application/pdf \
            application/vnd.openxmlformats-officedocument.wordprocessingml.document \
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet \
            application/vnd.openxmlformats-officedocument.presentationml.presentation; do
            if ! grep -Fq "$required" "$manifest_dump"; then
              printf 'Android manifest is missing required entry: %s\n' "$required"
              cat "$manifest_dump"
              exit 1
            fi
          done
          if grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' "$manifest_dump"; then
            echo 'Phone build must not advertise an Android TV launcher.'
            exit 1
          fi

          certificate_report="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$apk")"
          printf '%s\n' "$certificate_report"
          apk_certificate="$(printf '%s\n' "$certificate_report" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d '[:space:]:')"
          if [[ "$apk_certificate" != "$ANDROID_EXPECTED_CERT_SHA256" ]]; then
            printf 'APK certificate mismatch: expected %s, found %s\n' \
              "$ANDROID_EXPECTED_CERT_SHA256" "${apk_certificate:-none}"
            exit 1
          fi

          application_id="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest application-id "$apk")"
          version_name="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest version-name "$apk")"
          version_code="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest version-code "$apk")"
          expected_version="$(node -p "require('./package.json').version")"
          if [[ "$application_id" != "com.leafmark.desktop" ]]; then
            printf 'Unexpected Android application id: %s\n' "$application_id"
            exit 1
          fi
          if [[ "$version_name" != "$expected_version" ]]; then
            printf 'Unexpected Android version: expected %s, found %s\n' \
              "$expected_version" "$version_name"
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[0-9]+$ ]] || (( version_code <= 6000 )); then
            printf 'Android versionCode must be greater than the last debug-signed release (6000), found %s\n' \
              "$version_code"
            exit 1
          fi
          asset_name="LeafMark_${expected_version}_Android_arm64.apk"
          asset_dir="$RUNNER_TEMP/leafmark-release-assets"
          mkdir -p "$asset_dir"
          asset_path="$asset_dir/$asset_name"
          install -m 0644 "$apk" "$asset_path"
          asset_sha256="$(sha256sum "$asset_path" | awk '{print $1}')"
          {
            printf 'ANDROID_ASSET_NAME=%s\n' "$asset_name"
            printf 'ANDROID_ASSET_PATH=%s\n' "$asset_path"
            printf 'ANDROID_ASSET_SHA256=%s\n' "$asset_sha256"
          } >> "$GITHUB_ENV"
          sha256sum "$asset_path"
          du -h "$asset_path"

      - name: Upload and verify Android asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          set -euo pipefail
          old_asset_id="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$ANDROID_ASSET_NAME\") | .id"
          )"
          if [[ -n "$old_asset_id" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$old_asset_id"
          fi
          upload_json="$(
            curl --fail-with-body --silent --show-error --location --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$ANDROID_ASSET_PATH" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ANDROID_ASSET_NAME"
          )"
          read -r uploaded_name state digest size < <(
            jq -r '[.name, .state, .digest, .size] | @tsv' <<< "$upload_json"
          )
          if [[ "$uploaded_name" != "$ANDROID_ASSET_NAME" || "$state" != "uploaded" || "$digest" != "sha256:$ANDROID_ASSET_SHA256" ]]; then
            printf 'Android asset verification failed: state=%s digest=%s size=%s.\n' \
              "${state:-missing}" "${digest:-missing}" "${size:-missing}"
            exit 1
          fi

  release-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-linux-amd64

      - name: Install Tauri Linux dependencies
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=5 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend and native core
        run: |
          npm test
          npm run typecheck
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Linux bundles
        run: npx tauri build --ci --bundles appimage,deb

      - name: Verify Linux bundles and launch
        shell: bash
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          deb="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          if [[ -z "$appimage" || -z "$deb" ]]; then
            echo "Expected both AppImage and Debian artifacts."
            exit 1
          fi

          dpkg-deb --info "$deb"
          if ldd src-tauri/target/release/leafmark | grep -q 'not found'; then
            ldd src-tauri/target/release/leafmark
            exit 1
          fi

          set +e
          GDK_BACKEND=x11 timeout 15s xvfb-run --auto-servernum src-tauri/target/release/leafmark \
            > /tmp/leafmark-linux-smoke.log 2>&1
          status="$?"
          set -e
          cat /tmp/leafmark-linux-smoke.log
          if [[ "$status" -ne 124 ]]; then
            echo "Linux GUI did not remain healthy during the 15-second smoke test (status $status)."
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          asset_dir="$RUNNER_TEMP/leafmark-release-assets"
          mkdir -p "$asset_dir"
          appimage_name="LeafMark_${version}_Linux_amd64.AppImage"
          deb_name="LeafMark_${version}_Linux_amd64.deb"
          appimage_path="$asset_dir/$appimage_name"
          deb_path="$asset_dir/$deb_name"
          install -m 0755 "$appimage" "$appimage_path"
          install -m 0644 "$deb" "$deb_path"
          if (( $(stat -c '%s' "$appimage_path") < 10 * 1024 * 1024 )); then
            echo 'AppImage is unexpectedly small.'
            exit 1
          fi
          if (( $(stat -c '%s' "$deb_path") < 1024 * 1024 )); then
            echo 'Debian package is unexpectedly small.'
            exit 1
          fi
          {
            printf 'LINUX_APPIMAGE_NAME=%s\n' "$appimage_name"
            printf 'LINUX_APPIMAGE_PATH=%s\n' "$appimage_path"
            printf 'LINUX_APPIMAGE_SHA256=%s\n' "$(sha256sum "$appimage_path" | awk '{print $1}')"
            printf 'LINUX_DEB_NAME=%s\n' "$deb_name"
            printf 'LINUX_DEB_PATH=%s\n' "$deb_path"
            printf 'LINUX_DEB_SHA256=%s\n' "$(sha256sum "$deb_path" | awk '{print $1}')"
          } >> "$GITHUB_ENV"
          sha256sum "$appimage_path" "$deb_path"
          du -h "$appimage_path" "$deb_path"

      - name: Upload and verify Linux assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          set -euo pipefail
          upload_asset() {
            local name="$1"
            local path="$2"
            local expected_digest="$3"
            local old_asset_id upload_json uploaded_name state digest size
            old_asset_id="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
                --jq ".[] | select(.name == \"$name\") | .id"
            )"
            if [[ -n "$old_asset_id" ]]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$old_asset_id"
            fi
            upload_json="$(
              curl --fail-with-body --silent --show-error --location --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --header 'Content-Type: application/octet-stream' \
                --data-binary "@$path" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name"
            )"
            read -r uploaded_name state digest size < <(
              jq -r '[.name, .state, .digest, .size] | @tsv' <<< "$upload_json"
            )
            if [[ "$uploaded_name" != "$name" || "$state" != "uploaded" || "$digest" != "sha256:$expected_digest" ]]; then
              printf 'Linux asset %s verification failed: state=%s digest=%s size=%s.\n' \
                "$name" "${state:-missing}" "${digest:-missing}" "${size:-missing}"
              exit 1
            fi
          }
          upload_asset "$LINUX_APPIMAGE_NAME" "$LINUX_APPIMAGE_PATH" "$LINUX_APPIMAGE_SHA256"
          upload_asset "$LINUX_DEB_NAME" "$LINUX_DEB_PATH" "$LINUX_DEB_SHA256"

  publish-release:
    needs:
      - preflight
      - release-windows
      - release-android
      - release-linux
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify complete draft and publish as Latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if [[ "$(jq -r .draft <<< "$release_json")" != "true" ]]; then
            echo 'Release is no longer a draft; refusing an unverified republish.'
            exit 1
          fi
          if [[ "$(jq -r .tag_name <<< "$release_json")" != "$RELEASE_TAG" ]]; then
            echo 'Draft tag changed during the build.'
            exit 1
          fi
          if [[ "$(jq -r .target_commitish <<< "$release_json")" != "$GITHUB_SHA" ]]; then
            echo 'Draft target is not the validated main commit.'
            exit 1
          fi

          assets_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")"
          expected_assets=(
            "LeafMark_${RELEASE_VERSION}_Android_arm64.apk"
            "LeafMark_${RELEASE_VERSION}_Linux_amd64.AppImage"
            "LeafMark_${RELEASE_VERSION}_Linux_amd64.deb"
            "LeafMark_${RELEASE_VERSION}_x64-setup.exe"
          )
          mapfile -t actual_assets < <(jq -r '.[].name' <<< "$assets_json" | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_assets[@]}" | sort)
          if [[ "$(printf '%s\n' "${actual_assets[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            printf 'Draft must contain exactly the four verified platform assets.\nExpected:\n%s\nActual:\n%s\n' \
              "$(printf '%s\n' "${expected_sorted[@]}")" \
              "$(printf '%s\n' "${actual_assets[@]}")"
            exit 1
          fi

          for name in "${expected_assets[@]}"; do
            read -r state digest size < <(
              jq -r --arg name "$name" \
                '.[] | select(.name == $name) | [.state, .digest, .size] | @tsv' \
                <<< "$assets_json"
            )
            if [[ "$state" != "uploaded" || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf 'Asset %s is not fully uploaded or lacks a SHA-256 digest.\n' "$name"
              exit 1
            fi
            case "$name" in
              *.AppImage)
                (( size >= 10 * 1024 * 1024 )) || { echo "$name is unexpectedly small."; exit 1; }
                ;;
              *Android*.apk)
                (( size >= 1024 * 1024 && size <= 16 * 1024 * 1024 )) || {
                  echo "$name is outside the allowed Android size range."
                  exit 1
                }
                ;;
              *.deb|*.exe)
                (( size >= 1024 * 1024 )) || { echo "$name is unexpectedly small."; exit 1; }
                ;;
            esac
          done

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f target_commitish="$GITHUB_SHA" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null

          latest_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)"
          if [[ "$latest_id" != "$RELEASE_ID" ]]; then
            printf 'Published release %s did not become Latest (Latest is %s).\n' \
              "$RELEASE_ID" "$latest_id"
            exit 1
          fi
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            printf 'Release tag points to %s instead of %s.\n' "$tag_sha" "$GITHUB_SHA"
            exit 1
          fi
          printf 'Published %s from %s with four verified assets.\n' \
            "$RELEASE_TAG" "$GITHUB_SHA"

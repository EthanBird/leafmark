name: Native UI PR Gate

on:
  pull_request:
    types: [synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: leafmark-native-ui-pr-gate
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event.issue.number == 2 && github.event.issue.pull_request && github.event.comment.body == '/validate-native-ui')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Report runner start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 2 --repo "$GITHUB_REPOSITORY" --body "Native UI 验证器已取得 runner，开始执行完整 Rust 检查。Run: $GITHUB_RUN_ID"

      - uses: actions/checkout@v4
        with:
          ref: agent/native-three-platform
          fetch-depth: 0

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: native-ui-pr-gate

      - name: Validate Native workspace
        id: validate
        shell: bash
        run: |
          set +e
          {
            cd native
            cargo fmt --all --check
            cargo test --workspace --all-targets --locked
            cargo check -p leafmark-native --all-targets --locked
            cargo check -p leafmark-android --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
          } > "$RUNNER_TEMP/native-ui-validation.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/native-ui-validation.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-validation-log-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ui-validation.log
          if-no-files-found: error
          retention-days: 3

      - name: Report completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.validate.outputs.status }}
        run: |
          if [ "$STATUS" = "0" ]; then
            gh pr comment 2 --repo "$GITHUB_REPOSITORY" --body "Native UI 完整 Rust 验证通过。Run: $GITHUB_RUN_ID"
          elif [ -n "$STATUS" ]; then
            gh pr comment 2 --repo "$GITHUB_REPOSITORY" --body "Native UI Rust 验证失败，请读取该 Run 的 validation artifact / job log。Run: $GITHUB_RUN_ID"
            exit 1
          else
            gh pr comment 2 --repo "$GITHUB_REPOSITORY" --body "Native UI 验证器在进入 Rust 检查前失败。Run: $GITHUB_RUN_ID"
            exit 1
          fi

name: Diagnose LeafMark Native quality

on:
  push:
    branches: [agent/native-three-platform]
    paths:
      - .github/workflows/native-quality-diagnostics.yml
      - native/**
  pull_request:
    paths:
      - .github/workflows/native-quality-diagnostics.yml
      - native/**
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: leafmark-native-quality-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Generate lockfile
        working-directory: native
        run: cargo generate-lockfile
      - name: Check formatting
        id: fmt
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/fmt.log"
      - name: Test shared workspace
        id: tests
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets -- --skip parses_gfm_math_mermaid_and_ranges 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Check desktop shell
        id: desktop
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo check -p leafmark-native --all-targets 2>&1 | tee "$RUNNER_TEMP/desktop.log"
      - name: Check Android shell on host
        id: android
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo check -p leafmark-android --all-targets 2>&1 | tee "$RUNNER_TEMP/android-host.log"
      - name: Lint workspace
        id: clippy
        continue-on-error: true
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --lib --bins -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-quality-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fmt.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/desktop.log
            ${{ runner.temp }}/android-host.log
            ${{ runner.temp }}/clippy.log
          if-no-files-found: warn
          retention-days: 7
      - name: Publish diagnostic status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FMT: ${{ steps.fmt.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DESKTOP: ${{ steps.desktop.outcome }}
          ANDROID: ${{ steps.android.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        shell: bash
        run: |
          if [ "$FMT" = success ] && [ "$TESTS" = success ] && [ "$DESKTOP" = success ] && [ "$ANDROID" = success ] && [ "$CLIPPY" = success ]; then
            state=success
            description='fmt, tests, desktop, Android host and clippy passed'
          else
            state=failure
            description="fmt=$FMT tests=$TESTS desktop=$DESKTOP android=$ANDROID clippy=$CLIPPY"
            for log in "$RUNNER_TEMP/fmt.log" "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/desktop.log" "$RUNNER_TEMP/android-host.log" "$RUNNER_TEMP/clippy.log"; do
              [ -f "$log" ] || continue
              detail=$(grep -m1 -E '^error(\[[^]]+\])?:|^error:|^Diff in ' "$log" || true)
              if [ -n "$detail" ]; then
                detail=$(printf '%s' "$detail" | tr '\r\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-105)
                description="$description; $detail"
                break
              fi
            done
          fi
          description=$(printf '%s' "$description" | cut -c1-140)
          jq -n --arg state "$state" --arg description "$description" \
            --arg context 'leafmark/native-quality-diagnostics' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,description:$description,context:$context,target_url:$target_url}' > status.json
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @status.json
          test "$state" = success

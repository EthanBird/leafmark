name: Finalize and verify LeafMark Native

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/native-finalize-once.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leafmark-native-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/native-three-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-three-platform
          fetch-depth: 0
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Apply all verified source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          markdown = Path('native/crates/leafmark-markdown/src/lib.rs')
          text = markdown.read_text()
          text = text.replace(
              "pub fn slice<'a>(self, source: &'a str) -> Option<&'a str>",
              "pub fn slice(self, source: &str) -> Option<&str>",
              1,
          )
          text = text.replace(
              'assert_eq!(doc.outline[0].range.slice(source), Some("# 标题"));',
              'assert_eq!(doc.outline[0].range.slice(source), Some("# 标题\\n"));',
              1,
          )
          markdown.write_text(text)

          app = Path('native/crates/leafmark-app/src/lib.rs')
          text = app.read_text()
          text = text.replace(
              'use std::{path::PathBuf, time::{SystemTime, UNIX_EPOCH}};',
              'use std::time::{SystemTime, UNIX_EPOCH};',
              1,
          )
          app.write_text(text)

          android = Path('native/apps/leafmark-android/src/main.rs')
          text = android.read_text()
          if text.startswith('use std::path::PathBuf;'):
              text = '#[cfg(target_os = "android")]\n' + text
          android.write_text(text)
          PY
          rm -f \
            .github/workflows/native-fix-range-once.yml \
            .github/workflows/native-normalize-once.yml \
            .github/workflows/native-normalize-diagnostics.yml \
            .github/workflows/native-quality-diagnostics.yml \
            .github/workflows/native-finalize-once.yml
          cd native
          cargo fmt --all
      - name: Strict full verification
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-targets
          cargo check -p leafmark-native --all-targets
          cargo check -p leafmark-android --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified final source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize verified three-platform Native source"
          git push origin HEAD:agent/native-three-platform

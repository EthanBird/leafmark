name: Build LeafMark Native on Windows Linux Android

on:
  push:
    branches: [agent/native-three-platform, main]
    paths:
      - .github/workflows/native-three-platform.yml
      - native/**
  pull_request:
    paths:
      - .github/workflows/native-three-platform.yml
      - native/**
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: leafmark-native-three-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 25.2.9519653
  DIOXUS_VERSION: 0.7.9
  DX_ARCHIVE: dx-x86_64-unknown-linux-gnu.tar.gz

jobs:
  quality:
    name: Native quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Require both application manifests
        run: |
          test -f native/apps/leafmark-native/Dioxus.toml
          test -f native/apps/leafmark-android/Dioxus.toml
      - name: Verify one committed dependency lock
        working-directory: native
        run: |
          test -f Cargo.lock
          cargo metadata --locked --no-deps >/dev/null
      - name: Verify all shared crates and both shells
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-targets --locked
          cargo check -p leafmark-native --all-targets --locked
          cargo check -p leafmark-android --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

  windows:
    name: Windows x64 package
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: windows-x64
      - name: Build desktop release executable
        working-directory: native
        run: cargo build -p leafmark-native --release --locked
      - name: Verify GUI subsystem and package portable ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path native/Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $executable = Get-Item native/target/release/leafmark-native.exe
          $bytes = [IO.File]::ReadAllBytes($executable.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($machine -ne 0x8664) { throw "Native executable is not x64: 0x$($machine.ToString('x4'))" }
          if ($subsystem -ne 2) { throw "Native executable is not Windows GUI subsystem: $subsystem" }

          $stage = Join-Path $env:RUNNER_TEMP "LeafMark-Native-$version-Windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $executable.FullName (Join-Path $stage 'LeafMark-Native.exe')
          Copy-Item native/README.md (Join-Path $stage 'README.md')
          Copy-Item native/ANDROID.md (Join-Path $stage 'ANDROID.md')
          $archive = Join-Path $env:RUNNER_TEMP "LeafMark-Native-$version-Windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -CompressionLevel Optimal
          Get-FileHash -Algorithm SHA256 $archive | ForEach-Object {
            "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($archive))"
          } | Set-Content "$archive.sha256"
          "PACKAGE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CHECKSUM_PATH=$archive.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: leafmark-native-windows-x64
          path: |
            ${{ env.PACKAGE_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

  linux:
    name: Linux x86_64 package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: linux-x86_64
      - name: Build desktop release executable
        working-directory: native
        run: cargo build -p leafmark-native --release --locked
      - name: Package portable tarball
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' native/Cargo.toml | head -n1)
          stage="$RUNNER_TEMP/LeafMark-Native-$version-Linux-x86_64"
          mkdir -p "$stage"
          install -m 755 native/target/release/leafmark-native "$stage/leafmark-native"
          cp native/README.md native/ANDROID.md "$stage/"
          archive="$RUNNER_TEMP/LeafMark-Native-$version-Linux-x86_64.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$(basename "$stage")"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          echo "PACKAGE_PATH=$archive" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=$archive.sha256" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: leafmark-native-linux-x86_64
          path: |
            ${{ env.PACKAGE_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

  android:
    name: Android arm64 APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK NDK and arm64 Rust target
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: android-arm64
      - name: Install verified prebuilt Dioxus CLI
        run: |
          base="https://github.com/DioxusLabs/dioxus/releases/download/v$DIOXUS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$DX_ARCHIVE" --output "$DX_ARCHIVE"
          curl --fail --location --retry 3 \
            "$base/dx-x86_64-unknown-linux-gnu.sha256" --output dx.sha256
          grep "  $DX_ARCHIVE$" dx.sha256 | sha256sum --check -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$DX_ARCHIVE" -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/dx"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Bundle Dioxus Native arm64 APK
        working-directory: native/apps/leafmark-android
        run: |
          dx bundle \
            --android \
            --renderer native \
            --target aarch64-linux-android \
            --package-types apk \
            --release \
            --out-dir "$GITHUB_WORKSPACE/dist/android"
      - name: Collect and verify APK
        run: |
          mapfile -t apks < <(find dist/android native/target -type f -name '*.apk' -print 2>/dev/null | sort -u)
          if [ "${#apks[@]}" -ne 1 ]; then
            printf 'Expected exactly one APK, found %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' native/Cargo.toml | head -n1)
          package="$RUNNER_TEMP/LeafMark-Native-$version-Android-arm64.apk"
          cp "${apks[0]}" "$package"
          unzip -t "$package"
          unzip -l "$package" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$package" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 ABI in APK' >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$package")" > "$(basename "$package").sha256")
          echo "PACKAGE_PATH=$package" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=$package.sha256" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: leafmark-native-android-arm64
          path: |
            ${{ env.PACKAGE_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

  status:
    name: Three-platform result
    if: ${{ always() }}
    needs: [quality, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY: ${{ needs.quality.result }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          if [ "$QUALITY" = success ] && [ "$WINDOWS" = success ] && [ "$LINUX" = success ] && [ "$ANDROID" = success ]; then
            state=success
            description='Windows, Linux and Android packages built successfully'
          else
            state=failure
            description="quality=$QUALITY windows=$WINDOWS linux=$LINUX android=$ANDROID"
          fi
          jq -n --arg state "$state" --arg description "$description" \
            --arg context 'leafmark/native-three-platform' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,description:$description,context:$context,target_url:$target_url}' > status.json
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @status.json
          test "$state" = success

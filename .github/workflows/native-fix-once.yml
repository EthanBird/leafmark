name: Apply verified Native baseline fixes

on:
  push:
    branches: [main]
    paths: [.github/workflows/native-fix-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Apply baseline fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          cargo = Path('native/Cargo.toml')
          text = cargo.read_text()
          text = text.replace('version = "0.1.0"', 'version = "0.8.0-alpha.2"', 1)
          cargo.write_text(text)

          markdown = Path('native/crates/leafmark-markdown/src/lib.rs')
          text = markdown.read_text()
          old = 'assert_eq!(doc.outline[0].range.slice(source), Some("# 标题"));'
          new = 'assert_eq!(doc.outline[0].range.slice(source), Some("# 标题\\n"));'
          if old not in text:
              raise SystemExit('markdown range assertion not found')
          markdown.write_text(text.replace(old, new, 1))

          app = Path('native/crates/leafmark-app/src/lib.rs')
          text = app.read_text()
          old = 'use std::{path::PathBuf, time::{SystemTime, UNIX_EPOCH}};'
          new = 'use std::time::{SystemTime, UNIX_EPOCH};'
          if old not in text:
              raise SystemExit('unused PathBuf import not found')
          app.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/native-fix-once.yml
      - name: Verify full Native workspace
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-targets
          cargo check -p leafmark-native --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Native baseline and version"
          git push origin HEAD:main

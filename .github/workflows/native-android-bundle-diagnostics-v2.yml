name: Diagnose Android bundle with prebuilt Dioxus CLI

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/native-android-bundle-diagnostics-v2.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leafmark-native-android-bundle-diagnostics-v2
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 25.2.9519653
  DIOXUS_VERSION: 0.7.9

jobs:
  diagnose:
    if: github.head_ref == 'agent/native-three-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-three-platform
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: android-diagnostics-v2
      - name: Install verified prebuilt Dioxus CLI
        run: |
          base="https://github.com/DioxusLabs/dioxus/releases/download/v$DIOXUS_VERSION"
          curl --fail --location --retry 3 \
            "$base/dx-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/dx.tar.gz"
          curl --fail --location --retry 3 \
            "$base/dx-x86_64-unknown-linux-gnu.sha256" \
            --output "$RUNNER_TEMP/dx.sha256"
          cd "$RUNNER_TEMP"
          sed -i 's#\*/#*#g; s#  .*/#  #' dx.sha256
          sha256sum --check dx.sha256
          mkdir -p "$HOME/.local/bin"
          tar -xzf dx.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/dx"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Record CLI help and environment
        run: |
          {
            dx --version
            echo '=== bundle help ==='
            dx bundle --help
            echo '=== Android config ==='
            cat native/apps/leafmark-android/Dioxus.toml
            cat native/apps/leafmark-android/Cargo.toml
          } > "$RUNNER_TEMP/android-environment.log" 2>&1
      - name: Capture native Android bundle output
        id: bundle
        continue-on-error: true
        working-directory: native/apps/leafmark-android
        shell: bash
        run: |
          set +e
          RUST_BACKTRACE=1 dx bundle \
            --android \
            --renderer native \
            --package-types apk \
            --release \
            --out-dir "$GITHUB_WORKSPACE/dist/android" \
            > "$RUNNER_TEMP/android-bundle.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record generated tree
        if: ${{ always() }}
        run: |
          find native/apps/leafmark-android native/target dist -maxdepth 9 \
            -printf '%y %p %s bytes\n' 2>/dev/null | sort \
            > "$RUNNER_TEMP/android-generated-tree.log"
          find native/apps/leafmark-android native/target dist -type f \
            \( -name '*.log' -o -name '*.txt' \) -size -4M \
            -exec sh -c 'for file do echo "===== $file ====="; cat "$file"; done' sh {} + \
            > "$RUNNER_TEMP/android-secondary-logs.log" 2>&1 || true
      - name: Upload complete diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle-diagnostics-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/android-environment.log
            ${{ runner.temp }}/android-bundle.log
            ${{ runner.temp }}/android-generated-tree.log
            ${{ runner.temp }}/android-secondary-logs.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when bundle failed
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.bundle.outputs.exit_code }}
        run: test "$EXIT_CODE" = 0
